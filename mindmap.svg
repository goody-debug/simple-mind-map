<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="100%" stop-color="#2e3440" />
    </linearGradient>

    <!-- Drop Shadow for Nodes -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="#4c566a" stroke-width="8" />

  <!-- Connecting Curved Branches -->
  <path d="M 256 256 Q 160 160 112 160" fill="none" stroke="#88c0d0" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 256 256 Q 360 160 400 160" fill="none" stroke="#b48ead" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 256 256 Q 360 360 400 360" fill="none" stroke="#a3be8c" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 256 256 Q 160 360 112 360" fill="none" stroke="#ebcb8b" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Top-Left Child Node (Cyan) -->
  <circle cx="112" cy="160" r="36" fill="#88c0d0" filter="url(#shadow)" />
  <circle cx="112" cy="160" r="16" fill="#2e3440" />

  <!-- Top-Right Child Node (Purple) -->
  <circle cx="400" cy="160" r="36" fill="#b48ead" filter="url(#shadow)" />
  <circle cx="400" cy="160" r="16" fill="#2e3440" />

  <!-- Bottom-Right Child Node (Green) -->
  <circle cx="400" cy="360" r="36" fill="#a3be8c" filter="url(#shadow)" />
  <circle cx="400" cy="360" r="16" fill="#2e3440" />

  <!-- Bottom-Left Child Node (Yellow) -->
  <circle cx="112" cy="360" r="36" fill="#ebcb8b" filter="url(#shadow)" />
  <circle cx="112" cy="360" r="16" fill="#2e3440" />

  <!-- Central Root Node -->
  <circle cx="256" cy="256" r="56" fill="#88c0d0" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="28" fill="#2e3440" />
</svg>